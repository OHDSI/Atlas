<heading-title params="name: ko.i18n('navigation.jobs', 'Jobs'), icon: 'tasks', theme: 'dark'"></heading-title>

<div data-bind="if: canReadJobs">
	<div id="wrapperJobs">
		<div data-bind="click: updateJobs, text: ko.i18n('jobs.refreshJobs', 'Refresh Jobs')" 
			class="btn btn-xs btn-success pull-right">
		</div>
		<!-- ko if: canBatchCompare -->
		<div data-bind="click: runConceptSetDiffReport, text: ko.i18n('jobs.runConceptSetDiffReport', 'Run Concept Set Diff Report')" 
			class="btn btn-xs btn-primary pull-right" style="margin-right: 5px;">
		</div>
		<!-- /ko -->
		<div class="clear"></div>

		<loading data-bind="visible: isLoading()" 
			params="status: ko.i18n('jobs.loading', 'Loading jobs...')">
		</loading>
		
		<div data-bind="visible: !isLoading()">
			<faceted-datatable params="
				order: [[0, 'desc']],
				autoWidth: false,
				reference: jobs,
				columns: columns,
				options: {
					dom: 'Blfiprt',
					buttons: ['colvis', 'copyHtml5', 'csvHtml5']
				},
				pageLength: pageLength,
				lengthMenu: lengthMenu,
				rowClick: onRowClick,
				language: ko.i18n('datatable.language')
			">
			</faceted-datatable>
		</div>
	</div>
</div>

<access-denied params="isAuthenticated: isAuthenticated, isPermitted: canReadJobs"></access-denied>

<conceptset-batch-compare-modal params="isModalShown: isBatchCompareModalShown"></conceptset-batch-compare-modal>
