<div class="container-fluid">
  <div class="pull-left">
    <button class="btn btn-sm btn-primary"
      data-bind="click: showSaveNewModal, text: ko.i18n('cs.browser.compare.saveMessage', 'Save New Concept Set From Selection Below')"></button>
  </div>
  <div class="pull-right compare-results">
    <i data-bind="attr: { class: recordCountClass }" aria-hidden="true"></i>
    <span
      data-bind="text: ko.i18n('cs.browser.compare.viewCountMessage', 'View database record counts (RC) and descendant record counts (DRC) for:')"></span>
    <select data-bind="
        options: resultSources,
        optionsText: 'sourceName',
        optionsValue: 'sourceKey',
        value: currentResultSource().sourceKey,
        event: { change: refreshRecordCounts }
      "></select>
  </div>
</div>

<div class="panel panel-default"
  data-bind="collapsable: showDiagram, collapseTargetClass: 'panel-body', collapseOptions: { selectorClass: 'panel-heading', collapsabledClass: 'active' }">
  <div class="panel-heading panel-subheading panel-heading-collapsible div-enabled"
    data-bind="click: toggleShowDiagram">
    <span class="glyphicon-chevron-up"><i class="fas fa-chart-pie"></i> <span
        data-bind="text: ko.i18n('cs.browser.compare.vennDiagram', 'Venn Diagram')"></span></span>
  </div>
  <div class="panel-body collapse">
    <!-- ko if: !compareResultsSame() -->
    <div class="compare-results-same"
      data-bind="text: ko.i18n('cs.browser.compare.sameConcepts', 'Compared Concept Sets contain Concepts which are identical')">
    </div>
    <!-- /ko -->
    <!-- ko if: compareResultsSame() && hasMultipleSets() -->
    <venn-diagram params="{
        data: compareResults,
        firstConceptSet: compareCS1Caption,
        secondConceptSet: compareCS2Caption,
        updateOutsideFilters: updateOutsideFilters,
        lastSelectedMatchFilter: lastSelectedMatchFilter,
        diagramId: 'venn-included-concepts'
        }"></venn-diagram>
    <!-- /ko -->
    <!-- ko if: compareResultsSame() && !hasMultipleSets() -->
    <div class="compare-results-same"
      data-bind="text: ko.i18n('cs.browser.compare.insufficientDataForDiagram', 'Not enough data to display Venn diagram (all concepts are in only one set)')">
    </div>
    <!-- /ko -->
  </div>
</div>

<div id="compareResultsIncludedConcepts">
  <faceted-datatable params="{
      reference: compareResults,
      outsideFilters: outsideFilters,
      updateLastSelectedMatchFilter: updateLastSelectedMatchFilter,
      columns: compareResultsColumns,
      options: compareResultsOptions,
      order: compareResultsOptions.order,
      pageLength: compareResultsOptions.pageLength,
      lengthMenu: compareResultsOptions.lengthMenu,
      language: ko.i18n('datatable.language')
    }"></faceted-datatable>
</div>
